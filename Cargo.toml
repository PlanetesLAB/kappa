[package]
name = "kappa"
version = "0.1.31"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
approx = "0.5.1"
clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "3.1.1", optional = true }
ndarray = "0.17.2"
num-complex = "0.4.6"
rayon = "1.12.0"
planetes-ext = { git = "https://github.com/PlanetesLAB/planetes-ext", tag = "v1.8.0", features = [
    "complex",
] }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:colored"]
serde = ["dep:serde"]

[[bin]]
name = "kappa"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = true        # Link-time optimization
codegen-units = 1 # Slower build times, but more optimization
opt-level = 3     # Highest optimization level
